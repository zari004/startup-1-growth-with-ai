<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Marketplace Growth AI</title>
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><span style="display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:3px;margin-right:6px;"></span>MARKETPLACE GROWTH AI <span class="mono" style="color:var(--text-dim); font-size:12px;">/ admin</span></div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="adminName" class="mono" style="color:var(--text-dim); font-size:14px;"></span>
      <button id="logoutBtn" class="btn secondary">Chiqish</button>
    </div>
  </div>

  <div class="container">
    <div class="grid cols-3" style="margin-bottom:24px;">
      <div class="card"><div class="stat-num" id="sellerCount">0</div><div class="stat-label">Jami sellerlar</div></div>
      <div class="card"><div class="stat-num" id="openTotal">0</div><div class="stat-label">Barcha ochiq muammolar</div></div>
      <div class="card"><div class="stat-num">—</div><div class="stat-label">MRR (keyinroq qo'shiladi)</div></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Sellerlar ro'yxati</h3>
      <table>
        <thead><tr><th>Do'kon</th><th>Reja</th><th>Mahsulot</th><th>Ochiq ish</th><th>Qo'shilgan sana</th></tr></thead>
        <tbody id="sellersBody"></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="./assets/js/admin.js"></script>
</body>
</html>
