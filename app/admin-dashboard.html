<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Marketplace Growth AI</title>
<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><span style="display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:3px;margin-right:6px;"></span>MARKETPLACE GROWTH AI <span class="mono" style="color:var(--text-dim); font-size:12px;">/ admin</span></div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="adminName" class="mono" style="color:var(--text-dim); font-size:14px;"></span>
      <button id="logoutBtn" class="btn secondary">Chiqish</button>
    </div>
  </div>

  <div class="container">
    <div class="grid cols-3" style="margin-bottom:24px;">
      <div class="card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        <div class="stat-num" id="sellerCount">0</div><div class="stat-label">Jami sellerlar</div>
      </div>
      <div class="card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
        <div class="stat-num" id="openTotal">0</div><div class="stat-label">Barcha ochiq muammolar</div>
      </div>
      <div class="card">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        <div class="stat-num">—</div><div class="stat-label">MRR (keyinroq qo'shiladi)</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Sellerlar ro'yxati</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Do'kon</th><th>Reja</th><th>Mahsulot</th><th>Ochiq ish</th><th>Qo'shilgan sana</th></tr></thead>
          <tbody id="sellersBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="./assets/js/admin.js"></script>
</body>
</html>
